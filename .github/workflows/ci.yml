# .github/workflows/ci.yml
# Runs on every push and PR: installs deps and builds/checks both apps.
# Save this file at .github/workflows/ci.yml in your repo root (GitHub only
# recognizes workflows in that exact path).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  server:
    name: Server — install & syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax-check every JS file
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: Run tests
        run: npm test

  client:
    name: Client — install & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5000/api' }}