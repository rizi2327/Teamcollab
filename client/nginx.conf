# client/nginx.conf
# Serves the built Vite SPA. The try_files fallback is required for
# react-router-dom's client-side routes (e.g. /workspaces/:id) to work on
# a hard refresh — without it, nginx 404s on any path that isn't a real file.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html itself is never cached
    # so deploys are picked up immediately.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}